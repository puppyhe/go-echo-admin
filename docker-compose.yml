name: echo-admin

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${ECHO_ADMIN_DATABASE_NAME:-echo_admin}
      MYSQL_USER: ${ECHO_ADMIN_DATABASE_USER:-echo_admin}
      MYSQL_PASSWORD: ${ECHO_ADMIN_DATABASE_PASSWORD:-echo_admin_dev}
      MYSQL_ROOT_PASSWORD: ${ECHO_ADMIN_DATABASE_ROOT_PASSWORD:-root_dev_only}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${ECHO_ADMIN_DATABASE_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${ECHO_ADMIN_CACHE_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Optional S3-compatible development service.
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    profiles: [object-storage]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ECHO_ADMIN_STORAGE_S3_ACCESS_KEY:-echo-admin}
      MINIO_ROOT_PASSWORD: ${ECHO_ADMIN_STORAGE_S3_SECRET_KEY:-echo-admin-secret-change-me}
    ports:
      - "${ECHO_ADMIN_STORAGE_S3_PORT:-9000}:9000"
      - "${ECHO_ADMIN_STORAGE_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z-cpuv1
    profiles: [object-storage]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${ECHO_ADMIN_STORAGE_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${ECHO_ADMIN_STORAGE_S3_ACCESS_KEY:-echo-admin}
      MINIO_ROOT_PASSWORD: ${ECHO_ADMIN_STORAGE_S3_SECRET_KEY:-echo-admin-secret-change-me}
      ECHO_ADMIN_STORAGE_S3_BUCKET: ${ECHO_ADMIN_STORAGE_S3_BUCKET:-echo-admin}

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["/app/echo-admin-cli", "upgrade", "apply"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      ECHO_ADMIN_DATABASE_DRIVER: mysql
      ECHO_ADMIN_DATABASE_HOST: mysql
      ECHO_ADMIN_DATABASE_PORT: 3306
      ECHO_ADMIN_DATABASE_NAME: ${ECHO_ADMIN_DATABASE_NAME:-echo_admin}
      ECHO_ADMIN_DATABASE_USER: ${ECHO_ADMIN_DATABASE_USER:-echo_admin}
      ECHO_ADMIN_DATABASE_PASSWORD: ${ECHO_ADMIN_DATABASE_PASSWORD:-echo_admin_dev}
      ECHO_ADMIN_AUTH_JWT_SECRET: ${ECHO_ADMIN_AUTH_JWT_SECRET:-development-only-change-me-32-characters}
      ECHO_ADMIN_STORAGE_PROVIDER: ${ECHO_ADMIN_STORAGE_PROVIDER:-local}
      ECHO_ADMIN_STORAGE_PATH: /app/data/uploads
      ECHO_ADMIN_STORAGE_MAX_BYTES: ${ECHO_ADMIN_STORAGE_MAX_BYTES:-10485760}
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${ECHO_ADMIN_VERSION:-dev}
        COMMIT: ${ECHO_ADMIN_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      ECHO_ADMIN_SERVER_ADDRESS: :8080
      ECHO_ADMIN_SERVER_ALLOWED_ORIGINS: ${ECHO_ADMIN_SERVER_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      ECHO_ADMIN_DATABASE_DRIVER: mysql
      ECHO_ADMIN_DATABASE_HOST: mysql
      ECHO_ADMIN_DATABASE_PORT: 3306
      ECHO_ADMIN_DATABASE_NAME: ${ECHO_ADMIN_DATABASE_NAME:-echo_admin}
      ECHO_ADMIN_DATABASE_USER: ${ECHO_ADMIN_DATABASE_USER:-echo_admin}
      ECHO_ADMIN_DATABASE_PASSWORD: ${ECHO_ADMIN_DATABASE_PASSWORD:-echo_admin_dev}
      ECHO_ADMIN_AUTH_JWT_SECRET: ${ECHO_ADMIN_AUTH_JWT_SECRET:-development-only-change-me-32-characters}
      ECHO_ADMIN_CACHE_ENABLED: ${ECHO_ADMIN_CACHE_ENABLED:-true}
      ECHO_ADMIN_CACHE_ADDRESS: ${ECHO_ADMIN_CACHE_ADDRESS:-redis:6379}
      ECHO_ADMIN_QUEUE_DRIVER: ${ECHO_ADMIN_QUEUE_DRIVER:-database}
      ECHO_ADMIN_QUEUE_ADDRESS: ${ECHO_ADMIN_QUEUE_ADDRESS:-redis:6379}
      ECHO_ADMIN_SCHEDULER_ENABLED: ${ECHO_ADMIN_SCHEDULER_ENABLED:-true}
      ECHO_ADMIN_SCHEDULER_POLL_INTERVAL: ${ECHO_ADMIN_SCHEDULER_POLL_INTERVAL:-10s}
      ECHO_ADMIN_SCHEDULER_WORKERS: ${ECHO_ADMIN_SCHEDULER_WORKERS:-2}
      ECHO_ADMIN_STORAGE_PROVIDER: ${ECHO_ADMIN_STORAGE_PROVIDER:-local}
      ECHO_ADMIN_STORAGE_PATH: /app/data/uploads
      ECHO_ADMIN_STORAGE_MAX_BYTES: ${ECHO_ADMIN_STORAGE_MAX_BYTES:-10485760}
      ECHO_ADMIN_STORAGE_S3_ENDPOINT: ${ECHO_ADMIN_STORAGE_S3_ENDPOINT:-http://minio:9000}
      ECHO_ADMIN_STORAGE_S3_BUCKET: ${ECHO_ADMIN_STORAGE_S3_BUCKET:-echo-admin}
      ECHO_ADMIN_STORAGE_S3_REGION: ${ECHO_ADMIN_STORAGE_S3_REGION:-us-east-1}
      ECHO_ADMIN_STORAGE_S3_ACCESS_KEY: ${ECHO_ADMIN_STORAGE_S3_ACCESS_KEY:-echo-admin}
      ECHO_ADMIN_STORAGE_S3_SECRET_KEY: ${ECHO_ADMIN_STORAGE_S3_SECRET_KEY:-echo-admin-secret-change-me}
      ECHO_ADMIN_STORAGE_S3_PREFIX: ${ECHO_ADMIN_STORAGE_S3_PREFIX:-}
      ECHO_ADMIN_STORAGE_S3_USE_PATH_STYLE: ${ECHO_ADMIN_STORAGE_S3_USE_PATH_STYLE:-true}
      ECHO_ADMIN_DEMO_ENABLED: ${ECHO_ADMIN_DEMO_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${ECHO_ADMIN_SERVER_PORT:-8080}:8080"
    volumes:
      - uploads-data:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ECHO_ADMIN_WEB_PORT:-8081}:80"

volumes:
  mysql-data:
  redis-data:
  uploads-data:
  minio-data:
