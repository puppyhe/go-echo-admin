name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go checks
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: echo_admin
          MYSQL_USER: echo_admin
          MYSQL_PASSWORD: echo_admin_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pecho_admin_test -uecho_admin --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: development
      ECHO_ADMIN_DATABASE_HOST: 127.0.0.1
      ECHO_ADMIN_DATABASE_PORT: 3306
      ECHO_ADMIN_DATABASE_NAME: echo_admin
      ECHO_ADMIN_DATABASE_USER: echo_admin
      ECHO_ADMIN_DATABASE_PASSWORD: echo_admin_test
      ECHO_ADMIN_AUTH_JWT_SECRET: ci-only-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/server ./cmd/echo-admin

  frontend:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
