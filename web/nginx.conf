server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 51m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy operational endpoints used by the health page and container probes.
    location = /health/live { proxy_pass http://backend:8080/health/live; proxy_set_header Host $host; }
    location = /health/ready { proxy_pass http://backend:8080/health/ready; proxy_set_header Host $host; }
    location = /version { proxy_pass http://backend:8080/version; proxy_set_header Host $host; }

    # Proxy the versioned API to the Echo server.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # File center download URLs are tenant-authenticated by the backend.
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets must return 404 rather than a successful HTML login page.
    location /assets/ {
        try_files $uri =404;
    }
    location /brand/ {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
}
